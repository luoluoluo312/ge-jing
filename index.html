<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌境</title>
    <link rel="icon" href="data:," />
    <style>
      @font-face {
        font-family: 'Fusion Pixel';
        src: url('/assets/fonts/fusion-pixel-10px-monospaced/fusion-pixel-10px-monospaced-zh_hans.otf.woff2')
          format('woff2');
        font-display: block;
        font-style: normal;
        font-weight: 400;
      }

      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #071225;
      }

      #game {
        position: fixed;
        inset: 0;
      }

      canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        width: max(100vw, 177.7778vh) !important;
        height: max(100vh, 56.25vw) !important;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="歌境游戏画面"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
